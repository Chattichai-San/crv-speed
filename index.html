<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121518">
<title>มาตรวัดความเร็ว CR-V</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Sarabun:wght@400;600&display=swap">
<style>
/* Layout: one-screen instrument — dial (or giant digits) on top, 7-segment trip readouts below, controls pinned at bottom */
:root{
  --bg:#121518; --panel:#1b1f23; --disc:#181c20; --line:#2a3036; --track:#262b30;
  --fg:#eef1f3; --muted:#8a949c;
  --seg:#2ee8e0; --segoff:rgba(46,232,224,.09); --glow:rgba(46,232,224,.28); --over:#ff4d3d;
  --hot1:#e8762f; --hot2:#e5381f; --warn:#ff4d3d; --ok:#5fc48a; --fair:#e8a23a;
  --display:"Chakra Petch","Sarabun",system-ui,sans-serif;
  --body:"Sarabun",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  -webkit-user-select:none;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding-block:12px 4px;gap:8px}
header h1{font:700 1rem var(--display);letter-spacing:.06em;margin:0;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:12px}
.gps{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.good{background:var(--ok)} .dot.fair{background:var(--fair)} .dot.bad{background:var(--warn)}
.mode{font:700 .85rem var(--display);padding:8px 12px;border-radius:10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);letter-spacing:.04em;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:520px;width:100%;margin:0 auto}

/* หน้าปัด */
.dial{position:relative;width:100%;max-width:440px;margin:0 auto}
.dial svg{width:100%;height:auto;display:block}
.dial .center{position:absolute;left:0;right:0;top:36%;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.dial .center .seg{width:42%}
.dial .center .seg svg{filter:drop-shadow(0 0 8px var(--glow))}
.dial .center .u{font:700 1.3rem var(--display);color:var(--seg);margin-top:4px}
.dial .gps-note{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:.8rem;color:var(--muted)}
#needle,#prog{transition:transform .45s ease-out,stroke-dashoffset .45s ease-out}

/* ตัวเลข 7 ส่วน */
.seg .on{fill:var(--seg)} .seg .off{fill:var(--segoff)}
.over .seg .on,.seg.over .on{fill:var(--over)}

/* โหมดดิจิทัล */
.dig{display:flex;flex-direction:column;gap:6px;width:100%}
.dspeed svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 10px var(--glow))}
.dspeed.over svg{filter:drop-shadow(0 0 10px rgba(255,77,61,.3))}
.dunit{align-self:flex-end;font:700 1.9rem var(--display);color:var(--seg)}

/* สถิติ */
.dstats{display:grid;grid-template-columns:1fr 1fr;row-gap:20px}
.dcell{min-width:0;padding-inline:14px}
.dcell:nth-child(odd){border-right:1px solid var(--line)}
.dcell .k{font-size:.95rem;color:var(--muted);margin-bottom:6px}
.dval{display:flex;align-items:flex-end;gap:6px}
.dval svg{height:2rem;width:auto;max-width:100%}
.dval small{font:500 .95rem var(--display);color:var(--seg)}

.limit{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted)}
.limit select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 1rem var(--body)}
.msg{text-align:center;font-size:.9rem;color:var(--muted);min-height:1.3em}
.msg.err{color:var(--warn)}
.controls{display:grid;grid-template-columns:2fr 1fr;gap:10px;padding-block:12px 16px;max-width:520px;width:100%;margin:0 auto}
button{font:700 1.1rem var(--display);border-radius:14px;border:1px solid var(--line);padding:16px;cursor:pointer;background:var(--panel);color:var(--fg);letter-spacing:.04em}
button.primary{background:var(--seg);border-color:var(--seg);color:#06201f}
button.primary.running{background:transparent;color:var(--seg)}
button:focus-visible{outline:3px solid var(--seg);outline-offset:2px}
/* แนวนอน (มือถือ): ตัวเลขความเร็วดิจิทัลเต็มจออย่างเดียว */
@media (orientation:landscape) and (max-height:600px){
  header,.dial,.dstats,.limit,.msg,.controls{display:none!important}
  #dig,#dig[hidden]{display:flex!important;flex-direction:row;align-items:center;justify-content:center;gap:2vw;height:100%}
  main{max-width:none;height:100vh;height:100dvh;justify-content:center;align-items:center;gap:0}
  .dspeed svg{height:88vh;height:88dvh;width:auto;max-width:86vw}
  .dunit{align-self:flex-end;font-size:6vh;line-height:1;padding-bottom:7vh}
}
/* แอปที่ติดตั้งค้างแนวตั้ง: ใช้เซนเซอร์แรงโน้มถ่วงหมุนตัวเลขเอง */
body.rot header,body.rot .dial,body.rot .dstats,body.rot .limit,body.rot .msg,body.rot .controls{display:none!important}
body.rot #dig,body.rot #dig[hidden]{display:flex!important;position:fixed;top:50%;left:50%;width:100vh;height:100vw;flex-direction:row;align-items:center;justify-content:center;gap:2vh;transform:translate(-50%,-50%) rotate(var(--r,90deg))}
body.rot .dspeed svg{height:80vw;width:auto;max-width:84vh}
body.rot .dunit{align-self:flex-end;font-size:6vw;line-height:1;padding-bottom:11vw}
/* สีตัวเลข: ฟ้า (ค่าเริ่มต้น) / เขียว / แดง / เหลือง */
body[data-c="green"]{--seg:#3dff7a;--segoff:rgba(61,255,122,.09);--glow:rgba(61,255,122,.28)}
body[data-c="red"]{--seg:#ff3b30;--segoff:rgba(255,59,48,.10);--glow:rgba(255,59,48,.30);--over:#ffffff}
body[data-c="yellow"]{--seg:#ffd60a;--segoff:rgba(255,214,10,.09);--glow:rgba(255,214,10,.28)}
.colors{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted)}
.colors .sw{display:flex;gap:12px}
.colors button{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:0 0 8px var(--c)}
.colors button[aria-pressed="true"]{border-color:var(--fg);outline:2px solid var(--bg);outline-offset:-5px}
@media (orientation:landscape) and (max-height:600px){.colors{display:none!important}}
body.rot .colors{display:none!important}
/* ธีม LCD แบบเครื่องมือสำรวจ — ใช้ตอนตัวเลขเต็มจอ (แนวนอน) */
.ltape,.lfoot{display:none}
.colors button.lcdsw{background:radial-gradient(circle,#1c2416 0 28%,#b9c3a6 31%);box-shadow:0 0 0 1px #8e9a7a}
@media (orientation:landscape) and (max-height:600px){ body[data-c="lcd"]{--u:1vh;--uw:1vw} }
body.rot[data-c="lcd"]{--u:1vw;--uw:1vh}
@media (orientation:landscape) and (max-height:600px){ body[data-c="lcd"]{--seg:#1c2416;--segoff:rgba(28,36,22,.075);--glow:transparent;--over:#b3261e;background:#22262a} }
body.rot[data-c="lcd"]{--seg:#1c2416;--segoff:rgba(28,36,22,.075);--glow:transparent;--over:#b3261e;background:#22262a}
body[data-c="lcd"] #dig.lcdon{display:grid!important;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;align-items:center;
  width:calc(var(--uw)*95);height:calc(var(--u)*90);box-sizing:border-box;padding:calc(var(--u)*3) calc(var(--uw)*3.5);border-radius:14px;position:relative;
  background:linear-gradient(175deg,#c3cdb0 0%,#b3bf9e 55%,#a6b391 100%);color:#1c2416;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.35),inset 0 0 0 2px #8e9a7a,0 0 0 8px #15181b,0 0 0 9px #33383d}
body[data-c="lcd"] #dig.lcdon::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 30%)}
body.rot[data-c="lcd"] #dig.lcdon{position:fixed}
body[data-c="lcd"] #dig.lcdon .ltape{display:block;grid-column:1/3;grid-row:1;position:relative;height:calc(var(--u)*9);border-bottom:2px solid rgba(28,36,22,.55);overflow:hidden}
.lt{position:absolute;bottom:0;left:50%;display:flex;align-items:flex-end}
.lt span{width:calc(var(--uw)*3.2);height:calc(var(--u)*8);position:relative;display:flex;align-items:flex-end;justify-content:center;font:700 calc(var(--u)*2.6) var(--display)}
.lt span::after{content:"";position:absolute;bottom:0;left:50%;width:2px;height:calc(var(--u)*1.4);background:#1c2416}
.lt span.m::after{height:calc(var(--u)*2.6)}
.lt span em{font-style:normal;margin-bottom:calc(var(--u)*3.2)}
.lcar{position:absolute;left:50%;top:calc(var(--u)*.6);transform:translateX(-50%);z-index:2;font:700 calc(var(--u)*3.4) var(--display);background:#1c2416;color:#bfc9ac;padding:calc(var(--u)*.2) calc(var(--uw)*1);border-radius:3px;box-shadow:0 0 0 calc(var(--u)*.8) #bfc9ac}
body[data-c="lcd"] #dig.lcdon #dSpeed{grid-column:1;grid-row:2;justify-self:center}
body[data-c="lcd"] #dig.lcdon .dspeed svg{height:calc(var(--u)*58);width:auto;max-width:calc(var(--uw)*76);filter:none}
body[data-c="lcd"] #dig.lcdon .dunit{grid-column:2;grid-row:2;align-self:end;color:#1c2416;font:700 calc(var(--u)*5.4) var(--display);padding:0 0 calc(var(--u)*6)}
body[data-c="lcd"] #dig.lcdon .lfoot{display:flex;grid-column:1/3;grid-row:3;justify-content:space-between;align-items:baseline;border-top:2px solid rgba(28,36,22,.55);padding-top:calc(var(--u)*1.4);font:600 calc(var(--u)*2.9) var(--display);color:#1c2416}
.lfoot small{font:600 calc(var(--u)*2.2) var(--body);opacity:.7;margin-right:calc(var(--uw)*.6)}
.lfoot b{font-weight:600}
/* ธีม LCD — จอแนวตั้ง: ตัวเครื่องสีเข้ม + จอ LCD + ปุ่มแบบเครื่องมือสำรวจ */
@media (orientation:portrait){
 body[data-c="lcd"]:not(.rot){--seg:#1c2416;--segoff:rgba(28,36,22,.075);--glow:transparent;--over:#b3261e;--u:1vw;--uw:1vw;background:#1e2226}
 body[data-c="lcd"]:not(.rot) header h1{color:#c3cdb0}
 body[data-c="lcd"]:not(.rot) .mode{display:none}
 body[data-c="lcd"]:not(.rot) main{position:relative;justify-content:flex-start;gap:18px;margin-block:8px 4px;padding:12px 16px 14px;box-sizing:border-box;border-radius:14px;color:#1c2416;
   background:linear-gradient(175deg,#c6d0b3 0%,#b5c1a0 55%,#a7b492 100%);
   box-shadow:inset 0 3px 10px rgba(0,0,0,.35),inset 0 0 0 2px #8e9a7a,0 0 0 6px #121518,0 0 0 7px #353a40}
 body[data-c="lcd"]:not(.rot) main::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.2),transparent 28%)}
 body[data-c="lcd"]:not(.rot) #dial{display:none!important}
 body[data-c="lcd"]:not(.rot) #dig.lcdon{display:grid!important;width:auto;height:auto;padding:0;background:none;box-shadow:none;border-radius:0;row-gap:6px}
 body[data-c="lcd"]:not(.rot) #dig.lcdon::after{display:none}
 body[data-c="lcd"]:not(.rot) #dig.lcdon .ltape{height:calc(var(--u)*10)}
 body[data-c="lcd"]:not(.rot) .lt span{width:calc(var(--uw)*4.4);height:calc(var(--u)*9);font-size:calc(var(--u)*2.9)}
 body[data-c="lcd"]:not(.rot) .lt span em{margin-bottom:calc(var(--u)*3.6)}
 body[data-c="lcd"]:not(.rot) .lcar{font-size:calc(var(--u)*3.8);top:calc(var(--u)*.4)}
 body[data-c="lcd"]:not(.rot) #dig.lcdon .dspeed svg{height:calc(var(--u)*30);max-width:72vw}
 body[data-c="lcd"]:not(.rot) #dig.lcdon .dunit{font-size:calc(var(--u)*5.6);padding-bottom:calc(var(--u)*3)}
 body[data-c="lcd"]:not(.rot) #dig.lcdon .lfoot{flex-wrap:wrap;row-gap:4px;font-size:calc(var(--u)*3.4)}
 body[data-c="lcd"]:not(.rot) .lfoot span:nth-child(2){display:none}
 body[data-c="lcd"]:not(.rot) .lfoot small{font-size:calc(var(--u)*3)}
 body[data-c="lcd"]:not(.rot) .dstats{border-top:2px solid rgba(28,36,22,.55);padding-top:12px;row-gap:14px}
 body[data-c="lcd"]:not(.rot) .dcell:nth-child(odd){border-right-color:rgba(28,36,22,.3)}
 body[data-c="lcd"]:not(.rot) .dcell .k{color:#1c2416;opacity:.7}
 body[data-c="lcd"]:not(.rot) .dval small{color:#1c2416}
 body[data-c="lcd"]:not(.rot) .dval svg{height:2rem}
 body[data-c="lcd"]:not(.rot) .colors,body[data-c="lcd"]:not(.rot) .limit,body[data-c="lcd"]:not(.rot) .msg{color:#1c2416}
 body[data-c="lcd"]:not(.rot) .colors{border-top:2px solid rgba(28,36,22,.55);padding-top:14px;margin-top:auto}
 body[data-c="lcd"]:not(.rot) .colors button{width:28px;height:28px;box-shadow:none;border-color:rgba(28,36,22,.35)}
 body[data-c="lcd"]:not(.rot) .colors button[aria-pressed="true"]{border-color:#1c2416;outline-color:#b9c3a6}
 body[data-c="lcd"]:not(.rot) .limit select{background:transparent;color:#1c2416;border:2px solid rgba(28,36,22,.55)}
 body[data-c="lcd"]:not(.rot) .msg.err{color:#8a1d16}
 body[data-c="lcd"]:not(.rot) .controls button{background:linear-gradient(#353b41,#2a2f34);color:#d5ddc6;border:1px solid #444b52;border-radius:12px;box-shadow:0 4px 0 #0e1012,inset 0 1px 0 rgba(255,255,255,.08)}
 body[data-c="lcd"]:not(.rot) .controls button.primary{background:linear-gradient(#5d6e4b,#4a5a3b);border-color:#6f8159;color:#eef4e2}
 body[data-c="lcd"]:not(.rot) .controls button.primary.running{background:linear-gradient(#353b41,#2a2f34);border-color:#6f8159;color:#c6d0b3}
 body[data-c="lcd"]:not(.rot) .controls button:active{transform:translateY(3px);box-shadow:0 1px 0 #0e1012}
}
@media (prefers-reduced-motion:reduce){#needle,#prog{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Honda CR-V · GPS</h1>
  <div class="hdr-r"><div class="gps"><span class="dot" id="dot"></span><span id="acc">GPS ปิด</span></div><button class="mode" id="modeBtn" type="button">ดิจิทัล</button></div>
</header>

<main>
  <div class="dial" id="dial">
    <svg viewBox="0 0 320 320" aria-hidden="true">
      <defs>
        <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8762f"/><stop offset="1" stop-color="#d7261a"/>
        </linearGradient>
        <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="320"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="160" cy="160" r="156" fill="#181c20"/>
      <circle cx="160" cy="160" r="156" fill="none" stroke="#22272c" stroke-width="2"/>
      <g id="scale"></g>
      <path id="progTrack" fill="none" stroke="#262b30" stroke-width="14" stroke-linecap="butt"/>
      <path id="prog" fill="none" style="stroke:var(--seg)" stroke-width="14" stroke-linecap="butt" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity=".85"/>
      <line id="needle" x1="160" y1="58" x2="160" y2="20" stroke="#dffcfb" stroke-width="5" stroke-linecap="round" filter="url(#glow)"
        style="transform-origin:160px 160px;transform:rotate(-135deg)"/>
    </svg>
    <div class="center"><div class="seg" id="gSpeed"></div><div class="u">km/h</div></div>
  </div>

  <div class="dig" id="dig" hidden>
    <div class="ltape" id="lTape" aria-hidden="true"><div class="lt" id="lTicks"></div><div class="lcar" id="lHead">---°</div></div>
    <div class="dspeed seg" id="dSpeed"></div>
    <div class="dunit">km/h</div>
    <div class="lfoot" aria-hidden="true"><span><small>พิกัด</small><b id="lPos">—</b></span><span><small>ระยะทาง</small><b id="lDist">0.0 km</b></span><span><small>±</small><b id="lAcc">— m</b></span></div>
  </div>

  <div class="dstats">
    <div class="dcell"><div class="k">เวลาวิ่ง</div><div class="dval seg" id="dTime"></div></div>
    <div class="dcell"><div class="k">ระยะทาง</div><div class="dval seg"><span id="dDist"></span><small>km</small></div></div>
    <div class="dcell"><div class="k">ความเร็วเฉลี่ย</div><div class="dval seg"><span id="dAvg"></span><small>km/h</small></div></div>
    <div class="dcell"><div class="k">ความเร็วสูงสุด</div><div class="dval seg"><span id="dMax"></span><small>km/h</small></div></div>
  </div>

  <div class="colors">สีตัวเลข
    <div class="sw" id="colorSw">
      <button type="button" data-c="cyan" style="--c:#2ee8e0" aria-label="สีฟ้า"></button>
      <button type="button" data-c="green" style="--c:#3dff7a" aria-label="สีเขียว"></button>
      <button type="button" data-c="red" style="--c:#ff3b30" aria-label="สีแดง"></button>
      <button type="button" data-c="yellow" style="--c:#ffd60a" aria-label="สีเหลือง"></button>
      <button type="button" data-c="lcd" class="lcdsw" aria-label="จอ LCD แบบเครื่องมือสำรวจ (แนวนอน)"></button>
    </div>
  </div>

  <label class="limit" for="limitSel">เตือนเมื่อเกินความเร็ว
    <select id="limitSel">
      <option value="0">ไม่เตือน</option>
      <option value="60">60</option>
      <option value="80">80</option>
      <option value="90" selected>90</option>
      <option value="100">100</option>
      <option value="120">120</option>
    </select>
  </label>
  <div class="msg" id="msg">กำลังเปิด GPS…</div>
</main>

<div class="controls">
  <button class="primary" id="startBtn">เริ่มวัด</button>
  <button id="resetBtn">รีเซ็ต</button>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  // ---- หน้าปัด: 0–180 km/h กวาด 270° ----
  const MAXV=180, SWEEP=270, A0=-135, CX=160, CY=160;
  const ns='http://www.w3.org/2000/svg';
  const pt=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+r*Math.cos(a),CY+r*Math.sin(a)];};
  const ang=v=>A0+SWEEP*v/MAXV;
  const arc=(r,v1,v2)=>{const [x1,y1]=pt(ang(v1),r),[x2,y2]=pt(ang(v2),r);const big=(ang(v2)-ang(v1))>180?1:0;return `M${x1} ${y1} A${r} ${r} 0 ${big} 1 ${x2} ${y2}`;};
  const scale=$('scale');
  const add=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);scale.appendChild(e);return e;};
  // วงนอก: เทา → ส้ม → แดง ช่วงความเร็วสูง
  add('path',{d:arc(134,0,100),fill:'none',stroke:'#2e343a','stroke-width':5});
  add('path',{d:arc(134,100,180),fill:'none',stroke:'url(#hot)','stroke-width':5});
  for(let v=0;v<=MAXV;v+=10){
    const major=v%20===0, hot=v>100;
    const [a,b]=pt(ang(v),major?127:130),[c,e]=pt(ang(v),142);
    const ln=add('line',{x1:a,y1:b,x2:c,y2:e,stroke:hot?(v>=150?'#e5381f':'#e8762f'):(major?'':'#4a535b'),'stroke-width':major?3:1.5,'stroke-linecap':'round'}); if(major&&!hot) ln.style.stroke='var(--seg)';
    if(major){const [tx,ty]=pt(ang(v),112);
      const t=add('text',{x:tx,y:ty+5,'text-anchor':'middle',fill:'#c9d1d6','font-size':14,'font-weight':700,'font-family':'Chakra Petch, sans-serif'});t.textContent=v;}
  }
  $('progTrack').setAttribute('d',arc(92,0,180));
  $('prog').setAttribute('d',arc(92,0,180));
  // เข็มสั้นที่ขอบ (ยาวจาก r=100 ถึง r=138)
  $('needle').setAttribute('y1',CY-100); $('needle').setAttribute('y2',CY-140);

  // ---- ตัวเลข 7 ส่วน (วาดด้วย SVG) ----
  const SEGS={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg',' ':''};
  const hz=(x1,x2,y,t)=>`${x1},${y} ${x1+t/2},${y-t/2} ${x2-t/2},${y-t/2} ${x2},${y} ${x2-t/2},${y+t/2} ${x1+t/2},${y+t/2}`;
  const vt=(x,y1,y2,t)=>`${x},${y1} ${x+t/2},${y1+t/2} ${x+t/2},${y2-t/2} ${x},${y2} ${x-t/2},${y2-t/2} ${x-t/2},${y1+t/2}`;
  function digit(ch,ox){const W=60,H=100,t=12,g=2.5,L=t/2,R=W-t/2,T=t/2,M=H/2,B=H-t/2;
    const P={a:hz(L+g,R-g,T,t),b:vt(R,T+g,M-g,t),c:vt(R,M+g,B-g,t),d:hz(L+g,R-g,B,t),e:vt(L,M+g,B-g,t),f:vt(L,T+g,M-g,t),g:hz(L+g,R-g,M,t)};
    const on=SEGS[ch]??'';let s='';for(const k in P)s+=`<polygon class="${on.includes(k)?'on':'off'}" points="${P[k]}" transform="translate(${ox} 0)"/>`;return s;}
  function segSVG(str){let x=0,s='';for(const ch of str){
      if(ch==='.'){s+=`<rect class="on" x="${x}" y="88" width="12" height="12"/>`;x+=20;}
      else if(ch===':'){s+=`<rect class="on" x="${x}" y="26" width="11" height="11"/><rect class="on" x="${x}" y="63" width="11" height="11"/>`;x+=21;}
      else{s+=digit(ch,x);x+=74;}}
    return `<svg viewBox="-16 -2 ${x+14} 104" aria-hidden="true"><g transform="skewX(-7)">${s}</g></svg>`;}

  let watchId=null, wake=null, timer=null;
  let last=null, dist=0, maxV=0, movingMs=0, shown=0, beeped=false, lastKmh=0, buf=[];
  // ---- บันทึกทริป → Google Sheet + Calendar (ผ่านสคริปต์ CR-V Trip Log) ----
  const LOG_URL='https://script.google.com/macros/s/AKfycbxMs2Os-kUZAo7whJYZVRBVfbcwmwzIbVEyorfTfVhuhSz_bX3fSQWsuciE3H5LMa-yDA/exec';
  let tripStart=null, lastMove=null, tripSaved=false;
  const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
            del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
  function buildTrip(){
    const r1=x=>Math.round(x*10)/10;
    return {id:String(tripStart), start:new Date(tripStart).toISOString(), end:new Date(lastMove||Date.now()).toISOString(),
      distKm:Math.round(dist/10)/100, movingMin:r1(movingMs/60000), totalMin:r1(((lastMove||Date.now())-tripStart)/60000),
      avg:movingMs>5000?Math.round((dist/1000)/(movingMs/3600000)):0, max:Math.round(maxV)};
  }
  function queueTrip(t){ if(!t||!(t.distKm>=0.5)) return false; const q=ls.get('crv-queue',[]); if(!q.some(x=>x.id===t.id)) q.push(t); ls.set('crv-queue',q); return true; }
  // ต้องมีรหัสบันทึกทริป (ตั้งไว้ใน Apps Script) — ใส่ครั้งเดียวต่อเครื่อง คนอื่นที่มีลิงก์จึงบันทึกไม่ได้
  let stickyUntil=0;
  function note(t,err){$('msg').textContent=t;$('msg').classList.toggle('err',!!err);stickyUntil=err?Infinity:Date.now()+8000;}
  let flushing=false;
  async function flush(ask){
    const q=ls.get('crv-queue',[]); if(!q.length||flushing) return;
    let key=ls.get('crv-key','');
    if(!key && ask!==false){ key=(prompt('ใส่รหัสบันทึกทริป (ใส่ครั้งเดียวในเครื่องนี้)')||'').trim(); if(key) ls.set('crv-key',key); }
    if(!key){ note(`มีทริปรอบันทึก ${q.length} รายการ — แตะตรงนี้เพื่อใส่รหัส`,true); return; }
    flushing=true; stickyUntil=0; const left=[]; let bad=false;
    for(const t of q){
      if(bad){left.push(t);continue;}
      try{
        const r=await fetch(LOG_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},t,{key}))});
        const j=await r.json();
        if(j&&j.error==='key'){bad=true;left.push(t);}
      }catch(e){ left.push(t); }
    }
    flushing=false; ls.set('crv-queue',left);
    if(bad){ ls.del('crv-key'); note('รหัสบันทึกทริปไม่ถูกต้อง — แตะตรงนี้เพื่อใส่ใหม่',true); }
    else note(left.length ? `ยังส่งไม่ได้ (ไม่มีเน็ต?) — เก็บทริปไว้ ${left.length} รายการ จะส่งให้อีกครั้งอัตโนมัติ` : 'บันทึกทริปลงปฏิทินและชีตแล้ว ✓');
  }
  function resetTrip(){dist=0;maxV=0;movingMs=0;shown=0;last=null;lastKmh=0;buf=[];tripStart=null;lastMove=null;tripSaved=false;ls.del('crv-cur');}
  const isBig=()=>document.body.classList.contains('big');
  const landMQ=matchMedia('(orientation:landscape) and (max-height:600px)'), isLand=()=>landMQ.matches;
  let rot=0;
  // ---- ธีม LCD: แถบทิศ พิกัด ระยะทาง ความแม่นยำ ----
  let head=null, fix=null, lastTape=null;
  function brg(a,b){const t=x=>x*Math.PI/180,y=Math.sin(t(b.lon-a.lon))*Math.cos(t(b.lat)),
    x=Math.cos(t(a.lat))*Math.sin(t(b.lat))-Math.sin(t(a.lat))*Math.cos(t(b.lat))*Math.cos(t(b.lon-a.lon));return (Math.atan2(y,x)*180/Math.PI+360)%360;}
  function dms(v,p,n){const a=Math.abs(v),d=Math.floor(a),m=Math.floor((a-d)*60),s=Math.round(((a-d)*60-m)*60);
    return `${d}°${String(m).padStart(2,'0')}′${String(Math.min(s,59)).padStart(2,'0')}″${v>=0?p:n}`;}
  const NM={0:'N',45:'NE',90:'E',135:'SE',180:'S',225:'SW',270:'W',315:'NW'};
  function updLcd(){
    const on=document.body.dataset.c==='lcd'; $('dig').classList.toggle('lcdon',on); if(!on) return;
    const H=head==null?0:Math.round(head)%360;
    if(H!==lastTape){ lastTape=H; const base=Math.floor(H/15)*15; let t='';
      for(let k=-15;k<=15;k++){const a=((base+k*15)%360+360)%360;t+=`<span class="${NM[a]?'m':''}"><em>${NM[a]||''}</em></span>`;}
      $('lTicks').innerHTML=t; $('lTicks').style.transform=`translateX(calc(-50% - var(--uw)*3.2*${(H-base)/15}))`; }
    $('lHead').textContent = head==null ? '---°' : String(H).padStart(3,'0')+'°';
    $('lPos').textContent = fix ? `${dms(fix.lat,'N','S')}  ${dms(fix.lon,'E','W')}` : 'รอสัญญาณ GPS';
    $('lDist').textContent = (dist/1000).toFixed(1)+' km';
    $('lAcc').textContent = fix ? Math.round(fix.acc)+' m' : '— m';
  }

  function hav(a,b){const R=6371000,t=x=>x*Math.PI/180;
    const dLat=t(b.lat-a.lat),dLon=t(b.lon-a.lon);
    const h=Math.sin(dLat/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));}
  function fmtTime(ms){const s=Math.floor(ms/1000);
    return `${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}

  function renderStats(){
    $('dTime').innerHTML=segSVG(fmtTime(movingMs));
    $('dDist').innerHTML=segSVG((dist/1000).toFixed(2));
    $('dAvg').innerHTML=segSVG(String(movingMs>5000?Math.round((dist/1000)/(movingMs/3600000)):0));
    $('dMax').innerHTML=segSVG(String(Math.round(maxV)));
  }

  function render(kmh){
    shown = kmh===0 ? 0 : shown*0.4 + kmh*0.6;
    const spd=Math.round(shown), v=Math.max(0,Math.min(MAXV,shown));
    const lim=+$('limitSel').value, over=lim>0 && shown>lim;
    if(over && !beeped){beep();beeped=true;} if(!over) beeped=false;
    if(isBig()||isLand()||rot||document.body.dataset.c==='lcd'){
      $('dSpeed').innerHTML=segSVG(String(spd).padStart(3,' ')); $('dSpeed').classList.toggle('over',over);
    }
    if(!isBig()){
      $('needle').style.transform=`rotate(${ang(v)}deg)`;
      $('prog').setAttribute('stroke-dashoffset',100-100*v/MAXV);
      $('prog').style.stroke=over?'var(--over)':'var(--seg)';
      $('gSpeed').innerHTML=segSVG(String(spd)); $('gSpeed').classList.toggle('over',over);
    }
    renderStats(); if(typeof updLcd==='function') updLcd();
  }

  let ac=null;
  function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);
    o.start();o.stop(ac.currentTime+.5);}catch(e){}
    if(navigator.vibrate) navigator.vibrate(300);}

  function onPos(p){
    const c=p.coords, now=p.timestamp, acc=c.accuracy;
    $('dot').className='dot '+(acc<=10?'good':acc<=30?'fair':'bad');
    $('acc').textContent=`±${Math.round(acc)} ม.`;
    const free=Date.now()>stickyUntil;
    if(free){ $('msg').textContent=''; $('msg').classList.remove('err'); }
    const cur={lat:c.latitude,lon:c.longitude,t:now,acc:acc};
    let kmh=0;
    if(acc>15){                                                       // ใช้เฉพาะสัญญาณ GPS ที่แม่นพอ
      if(free) $('msg').textContent='สัญญาณ GPS ยังไม่แม่น (ในอาคาร?) — ความเร็วแสดง 0 จนกว่าจะจับดาวเทียมได้';
      last=null; buf=[]; lastKmh=0; render(0); return;
    }
    if(c.speed!=null && !isNaN(c.speed)){
      kmh=c.speed*3.6;                                                // ความเร็วจากดาวเทียม (Doppler)
    } else if(last){
      const dt=(now-last.t)/1000, d=hav(last,cur);
      if(dt>=1 && acc<=10 && last.acc<=10 && d > (acc+last.acc)) kmh=d/dt*3.6;
    }
    buf.push(kmh); if(buf.length>3) buf.shift();
    kmh = buf.length<3 ? 0 : [...buf].sort((a,b)=>a-b)[1];           // ค่ากลาง 3 ครั้งล่าสุด
    if(kmh<5) kmh=0;                                                  // ตัดค่าลอยตอนจอด
    if(last){const dt=Math.max(1,(now-last.t)/1000); const l=20*dt; kmh=Math.min(lastKmh+l, Math.max(lastKmh-l, kmh));}
    if(kmh>220) kmh=lastKmh;
    if(last && kmh>0){
      const d=hav(last,cur), dt=now-last.t;
      if(d < (kmh/3.6)*(dt/1000)*1.5 + acc){dist+=d; movingMs+=dt;}
    }
    if(kmh>0){ maxV=Math.max(maxV,kmh); if(!tripStart) tripStart=now; lastMove=now; }
    if(tripStart && dist>0) ls.set('crv-cur',buildTrip());          // กันข้อมูลหายถ้าปิดแอปโดยไม่กดหยุด
    if(c.heading!=null && !isNaN(c.heading) && kmh>=5) head=c.heading;
    else if(last && kmh>=5 && hav(last,cur)>8) head=brg(last,cur);
    fix=cur;
    lastKmh=kmh; last=cur;
    render(kmh);
  }

  function onErr(e){
    const m={1:'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — เปิดสิทธิ์ Location ให้ Chrome แล้วลองใหม่',
             2:'ยังจับสัญญาณ GPS ไม่ได้ — ลองออกที่โล่ง',3:'รอสัญญาณ GPS นานเกินไป กำลังลองใหม่…'};
    $('msg').textContent=m[e.code]||'GPS ขัดข้อง'; $('msg').classList.add('err');
    if(e.code===1) stop();
  }

  async function start(){
    if(tripSaved) resetTrip();
    if(!('geolocation' in navigator)){$('msg').textContent='เครื่องนี้ไม่รองรับ GPS ในเบราว์เซอร์';$('msg').classList.add('err');return;}
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
    $('msg').textContent='กำลังหาสัญญาณ GPS…';
    $('startBtn').textContent='หยุด'; $('startBtn').classList.add('running');
    timer=setInterval(()=>{$('dTime').innerHTML=segSVG(fmtTime(movingMs));},1000);
    try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){}
  }
  function stop(){
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    watchId=null; clearInterval(timer); last=null; lastKmh=0; buf=[];
    try{wake&&wake.release();}catch(e){} wake=null;
    $('startBtn').textContent='เริ่มวัด'; $('startBtn').classList.remove('running');
    $('dot').className='dot'; $('acc').textContent='GPS ปิด';
    render(0);
    if(tripStart && queueTrip(buildTrip())){ ls.del('crv-cur'); tripSaved=true; $('msg').textContent='กำลังบันทึกทริป…'; flush(); }
    else if(tripStart){ $('msg').textContent='ทริปสั้นกว่า 0.5 กม. — ไม่บันทึก'; }
  }
  $('startBtn').onclick=()=>watchId==null?start():stop();
  $('msg').onclick=()=>flush();
  $('resetBtn').onclick=()=>{resetTrip();render(0);};
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible' && watchId!=null){
      try{ if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen'); }catch(e){}
    }});
  try{const s=localStorage.getItem('crv-limit'); if(s) $('limitSel').value=s;}catch(e){}
  $('limitSel').onchange=e=>{try{localStorage.setItem('crv-limit',e.target.value);}catch(_){}};

  // สลับหน้าปัดเข็ม / ตัวเลขดิจิทัล — แอปจำค่าไว้
  function setBig(on){document.body.classList.toggle('big',on);$('dig').hidden=!on;$('dial').hidden=on;
    $('modeBtn').textContent=on?'เข็ม':'ดิจิทัล';render(lastKmh);try{localStorage.setItem('crv-big',on?'1':'0')}catch(e){}}
  try{setBig(localStorage.getItem('crv-big')==='1')}catch(e){setBig(false)}
  $('modeBtn').onclick=()=>setBig(!isBig());
  $('dial').onclick=()=>setBig(true); $('dSpeed').onclick=()=>{if(isLand()||rot) nextColor(); else setBig(false);};
  const COLORS=['cyan','green','red','yellow','lcd'];
  function setColor(c){ if(!COLORS.includes(c)) c='cyan'; document.body.dataset.c=c; setTimeout(updLcd,0);
    document.querySelectorAll('#colorSw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c));
    try{localStorage.setItem('crv-color',c)}catch(e){} }
  function nextColor(){ setColor(COLORS[(COLORS.indexOf(document.body.dataset.c||'cyan')+1)%COLORS.length]); }
  document.querySelectorAll('#colorSw button').forEach(b=>b.onclick=()=>setColor(b.dataset.c));
  try{setColor(localStorage.getItem('crv-color')||'cyan')}catch(e){setColor('cyan')}
  try{landMQ.addEventListener('change',()=>render(lastKmh));}catch(e){landMQ.addListener(()=>render(lastKmh));}
  // ปลดล็อกการหมุนจอของแอปที่ติดตั้งไว้ (เดิมล็อกแนวตั้ง)
  const unlockRot=()=>{try{screen.orientation.lock('any').catch(()=>{});}catch(e){}};
  unlockRot(); document.addEventListener('click',unlockRot,{once:true});
  // สำรอง: ถ้าจอยังไม่หมุน ใช้เซนเซอร์ดูว่าวางโทรศัพท์แนวนอนแล้วหมุนตัวเลขให้เอง
  function setRot(r){ if(r===rot) return; rot=r;
    document.body.classList.toggle('rot',!!r); document.body.style.setProperty('--r',r+'deg'); render(lastKmh); }
  addEventListener('devicemotion',e=>{const g=e.accelerationIncludingGravity; if(!g||g.x==null) return;
    if(isLand()){ setRot(0); return; }                     // จอหมุนจริงแล้ว ไม่ต้องหมุนเอง
    const ax=g.x, ay=g.y;
    if(Math.abs(ax)>6.5 && Math.abs(ax)>Math.abs(ay)*1.8) setRot(ax>0?90:-90);
    else if(Math.abs(ay)>6.5 && Math.abs(ay)>Math.abs(ax)*1.8) setRot(0);  // วางราบ = คงสถานะเดิม
  });

  // ทริปที่ค้างจากครั้งก่อน (ปิดแอปโดยไม่กดหยุด) → ส่งบันทึก
  const prev=ls.get('crv-cur',null); if(prev){ queueTrip(prev); ls.del('crv-cur'); }
  flush(false);
  window.addEventListener('online',()=>flush(false));
  // เปิด GPS อัตโนมัติเมื่อเปิดแอป
  start();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
